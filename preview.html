<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>أضف سيارة</title><script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:Tahoma,sans-serif;background:#F8FAFC}.b6{background:#2563EB}.tb{color:#2563EB}.bl{background:#EFF6FF}</style>
</head><body class="pb-28">
<div class="max-w-md mx-auto px-3 py-4">
  <h1 class="text-2xl font-black text-slate-900">أضف سيارة جديدة</h1>
  <p class="text-sm text-slate-500 mb-4">أكمل الخطوات لنشر إعلانك باحترافية</p>

  <!-- Stepper -->
  <div class="bg-white rounded-3xl p-4 shadow-sm mb-4">
    <div class="flex items-center">
      <div class="flex flex-col items-center gap-1"><span class="grid h-9 w-9 place-items-center rounded-full b6 text-white">✓</span><span class="text-[10px] font-bold tb">الصور</span></div>
      <div class="mx-1 mb-4 h-0.5 flex-1 b6 rounded-full"></div>
      <div class="flex flex-col items-center gap-1"><span class="grid h-9 w-9 place-items-center rounded-full b6 text-white shadow-lg">🚗</span><span class="text-[10px] font-bold tb">المعلومات</span></div>
      <div class="mx-1 mb-4 h-0.5 flex-1 bg-slate-100 rounded-full"></div>
      <div class="flex flex-col items-center gap-1"><span class="grid h-9 w-9 place-items-center rounded-full bg-slate-100 text-slate-400">📄</span><span class="text-[10px] font-bold text-slate-400">التفاصيل</span></div>
      <div class="mx-1 mb-4 h-0.5 flex-1 bg-slate-100 rounded-full"></div>
      <div class="flex flex-col items-center gap-1"><span class="grid h-9 w-9 place-items-center rounded-full bg-slate-100 text-slate-400">🏷️</span><span class="text-[10px] font-bold text-slate-400">السعر</span></div>
      <div class="mx-1 mb-4 h-0.5 flex-1 bg-slate-100 rounded-full"></div>
      <div class="flex flex-col items-center gap-1"><span class="grid h-9 w-9 place-items-center rounded-full bg-slate-100 text-slate-400">✓</span><span class="text-[10px] font-bold text-slate-400">نشر</span></div>
    </div>
  </div>

  <!-- Card: المعلومات -->
  <div class="bg-white rounded-3xl p-5 shadow-sm mb-4">
    <h2 class="text-base font-black text-slate-900">معلومات أساسية</h2>
    <p class="text-xs text-slate-400 mb-4">ابدأ بعنوان واضح وبيانات السيارة</p>
    <label class="block mb-3"><span class="block text-[13px] font-black text-slate-700 mb-1.5">عنوان الإعلان <span class="text-rose-500">*</span></span>
      <input value="تويوتا كامري 2018 بحالة ممتازة" class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm font-bold text-slate-900"></label>
    <div class="grid grid-cols-2 gap-3">
      <label class="block"><span class="block text-[13px] font-black text-slate-700 mb-1.5">الماركة</span><input value="تويوتا" class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm font-bold"></label>
      <label class="block"><span class="block text-[13px] font-black text-slate-700 mb-1.5">الموديل</span><input value="كامري" class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm font-bold"></label>
    </div>
  </div>

  <!-- Card: chips -->
  <div class="bg-white rounded-3xl p-5 shadow-sm">
    <h2 class="text-base font-black text-slate-900 mb-4">مواصفات إضافية</h2>
    <div class="flex flex-wrap gap-2">
      <span class="inline-flex items-center gap-1.5 rounded-xl border border-blue-500 bl tb px-3 py-2 text-sm font-bold">✓ كاميرا خلفية</span>
      <span class="inline-flex items-center gap-1.5 rounded-xl border border-blue-500 bl tb px-3 py-2 text-sm font-bold">✓ حساسات</span>
      <span class="inline-flex items-center gap-1.5 rounded-xl border border-slate-200 text-slate-600 px-3 py-2 text-sm font-bold">مكيف</span>
      <span class="inline-flex items-center gap-1.5 rounded-xl border border-slate-200 text-slate-600 px-3 py-2 text-sm font-bold">بلوتوث</span>
      <span class="inline-flex items-center gap-1.5 rounded-xl border border-slate-200 text-slate-600 px-3 py-2 text-sm font-bold">فتحة سقف</span>
    </div>
  </div>
</div>

<!-- Sticky bar -->
<div class="fixed inset-x-0 bottom-0 border-t border-slate-200 bg-white/85 backdrop-blur-lg">
  <div class="max-w-md mx-auto flex items-center gap-3 px-4 py-3">
    <button class="rounded-2xl border border-slate-200 px-5 py-3 text-sm font-black text-slate-600">السابق</button>
    <button class="flex-1 flex items-center justify-center gap-1.5 rounded-2xl b6 px-6 py-3 text-sm font-black text-white">التالي ‹</button>
  </div>
</div>
</body></html>
